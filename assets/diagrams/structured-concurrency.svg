<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title description">
<title id="title">A Job tree makes lifetime ownership explicit</title><desc id="description">Parent cancellation propagates down; failure propagation depends on the parent Job type.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker><marker id="inherits" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1 1 L 11 6 L 1 11 z" fill="white" stroke="#718096" stroke-width="1.2"/></marker></defs>
<rect width="1200" height="530" rx="22" fill="#f7f9fd"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#18243a">
<text x="36" y="49" font-size="29" font-weight="700" text-anchor="start" fill="#18243a">A Job tree makes lifetime ownership explicit</text>
<text x="36" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">Parent cancellation propagates down; failure propagation depends on the parent Job type.</text>
<rect x="433" y="119" width="334" height="78" rx="16" fill="#f0ebfc" stroke="#6d45ce" stroke-width="1.4"/>
<text x="453" y="153" font-size="22" font-weight="650" text-anchor="start" fill="#6d45ce">Owner Job</text>
<rect x="200" y="279" width="280" height="78" rx="16" fill="#e6f5f2" stroke="#087e80" stroke-width="1.4"/>
<text x="220" y="313" font-size="22" font-weight="650" text-anchor="start" fill="#087e80">Load child</text>
<rect x="720" y="279" width="280" height="78" rx="16" fill="#e6f5f2" stroke="#087e80" stroke-width="1.4"/>
<text x="740" y="313" font-size="22" font-weight="650" text-anchor="start" fill="#087e80">Observe child</text>
<polyline points="520,197 520,238 340,238 340,277" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="680,197 680,238 860,238 860,277" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="424" width="260" height="72" rx="16" fill="#ffffff" stroke="#d7deea" stroke-width="1.4"/>
<text x="70" y="458" font-size="22" font-weight="650" text-anchor="start" fill="#18243a">Request A</text>
<rect x="370" y="424" width="260" height="72" rx="16" fill="#ffffff" stroke="#d7deea" stroke-width="1.4"/>
<text x="390" y="458" font-size="22" font-weight="650" text-anchor="start" fill="#18243a">Request B</text>
<polyline points="290,357 290,393 180,393 180,422" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="390,357 390,393 500,393 500,422" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="720" y="413" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">An ordinary child failure can cancel</text>
<text x="720" y="440" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">its parent and siblings.</text>
<text x="720" y="477" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">SupervisorJob isolates failures</text>
<text x="720" y="504" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">of its direct children only.</text>
</g></svg>
