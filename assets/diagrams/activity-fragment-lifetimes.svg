<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
<title id="title">Activity and Fragment view lifetimes</title><desc id="description">Callback flow is simplified; process termination can happen without onDestroy().</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker><marker id="inherits" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1 1 L 11 6 L 1 11 z" fill="white" stroke="#718096" stroke-width="1.2"/></marker></defs>
<rect width="1200" height="660" rx="22" fill="#f7f9fd"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#18243a">
<text x="36" y="49" font-size="29" font-weight="700" text-anchor="start" fill="#18243a">Activity and Fragment view lifetimes</text>
<text x="36" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">Callback flow is simplified; process termination can happen without onDestroy().</text>
<rect x="36" y="124" width="246" height="78" rx="16" fill="#f0ebfc" stroke="#6d45ce" stroke-width="1.4"/>
<text x="56" y="158" font-size="22" font-weight="650" text-anchor="start" fill="#6d45ce">Created</text>
<rect x="477" y="124" width="246" height="78" rx="16" fill="#f0ebfc" stroke="#6d45ce" stroke-width="1.4"/>
<text x="497" y="158" font-size="22" font-weight="650" text-anchor="start" fill="#6d45ce">Started</text>
<rect x="918" y="124" width="246" height="78" rx="16" fill="#e6f5f2" stroke="#087e80" stroke-width="1.4"/>
<text x="938" y="158" font-size="22" font-weight="650" text-anchor="start" fill="#087e80">Resumed</text>
<polyline points="282,163 475,163" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="338" y="146" font-size="17" font-weight="400" text-anchor="start" fill="#52617a">onStart()</text>
<polyline points="723,163 916,163" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="779" y="146" font-size="17" font-weight="400" text-anchor="start" fill="#52617a">onResume()</text>
<rect x="918" y="285" width="246" height="78" rx="16" fill="#fff4df" stroke="#a15b0b" stroke-width="1.4"/>
<text x="938" y="319" font-size="22" font-weight="650" text-anchor="start" fill="#a15b0b">Paused</text>
<rect x="477" y="285" width="246" height="78" rx="16" fill="#fff4df" stroke="#a15b0b" stroke-width="1.4"/>
<text x="497" y="319" font-size="22" font-weight="650" text-anchor="start" fill="#a15b0b">Stopped</text>
<rect x="36" y="285" width="246" height="78" rx="16" fill="#fcecef" stroke="#b33e51" stroke-width="1.4"/>
<text x="56" y="319" font-size="22" font-weight="650" text-anchor="start" fill="#b33e51">Destroyed</text>
<polyline points="1041,202 1041,283" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1059" y="249" font-size="17" font-weight="400" text-anchor="start" fill="#52617a">onPause()</text>
<polyline points="918,324 725,324" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="784" y="307" font-size="17" font-weight="400" text-anchor="start" fill="#52617a">onStop()</text>
<polyline points="477,324 284,324" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="330" y="307" font-size="17" font-weight="400" text-anchor="start" fill="#52617a">onDestroy()</text>
<polyline points="1140,285 1180,285 1180,163 1166,163" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="937" y="268" font-size="16" font-weight="400" text-anchor="start" fill="#52617a">onResume() to return</text>
<polyline points="600,285 600,204" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="345" y="249" font-size="17" font-weight="400" text-anchor="start" fill="#52617a">onRestart() → onStart()</text>
<rect x="36" y="422" width="1128" height="172" rx="16" fill="#ffffff" stroke="#d7deea" stroke-width="1.4"/>
<text x="60" y="459" font-size="21" font-weight="650" text-anchor="start" fill="#18243a">One Fragment instance can have several successive View instances.</text>
<rect x="60" y="484" width="276" height="78" rx="16" fill="#e6f5f2" stroke="#087e80" stroke-width="1.4"/>
<text x="80" y="518" font-size="22" font-weight="650" text-anchor="start" fill="#087e80">View A created</text>
<rect x="460" y="484" width="282" height="78" rx="16" fill="#fcecef" stroke="#b33e51" stroke-width="1.4"/>
<text x="480" y="518" font-size="22" font-weight="650" text-anchor="start" fill="#b33e51">onDestroyView()</text>
<rect x="866" y="484" width="274" height="78" rx="16" fill="#e6f5f2" stroke="#087e80" stroke-width="1.4"/>
<text x="886" y="518" font-size="22" font-weight="650" text-anchor="start" fill="#087e80">View B created</text>
<polyline points="336,523 458,523" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="742,523 864,523" fill="none" stroke="#718096" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="36" y="632" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">Bind View references and UI collectors to viewLifecycleOwner, and release them at view destruction.</text>
</g></svg>
