<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
<title id="title">OOP: four ideas working together</title><desc id="description">Objects combine state and behavior; contracts keep their collaboration understandable.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker><marker id="inherits" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1 1 L 11 6 L 1 11 z" fill="white" stroke="#718096" stroke-width="1.2"/></marker></defs>
<rect width="1200" height="540" rx="22" fill="#f7f9fd"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#18243a">
<text x="36" y="49" font-size="29" font-weight="700" text-anchor="start" fill="#18243a">OOP: four ideas working together</text>
<text x="36" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">Objects combine state and behavior; contracts keep their collaboration understandable.</text>
<rect x="36" y="116" width="548" height="168" rx="16" fill="#e6f5f2" stroke="#087e80" stroke-width="1.4"/>
<text x="56" y="150" font-size="22" font-weight="650" text-anchor="start" fill="#087e80">Encapsulation</text>
<text x="56" y="181" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">Wallet keeps balance private.</text>
<text x="56" y="208" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">deposit(amount) validates the change.</text>
<text x="56" y="235" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">Callers cannot bypass the invariant.</text>
<rect x="616" y="116" width="548" height="168" rx="16" fill="#f0ebfc" stroke="#6d45ce" stroke-width="1.4"/>
<text x="636" y="150" font-size="22" font-weight="650" text-anchor="start" fill="#6d45ce">Abstraction</text>
<text x="636" y="181" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">PaymentGateway exposes pay(amount).</text>
<text x="636" y="208" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">Checkout uses the capability it needs.</text>
<text x="636" y="235" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">Transport details stay behind the contract.</text>
<rect x="36" y="312" width="548" height="168" rx="16" fill="#f0ebfc" stroke="#6d45ce" stroke-width="1.4"/>
<text x="56" y="346" font-size="22" font-weight="650" text-anchor="start" fill="#6d45ce">Inheritance</text>
<text x="56" y="377" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">ChartView is a specialized View.</text>
<text x="56" y="404" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">It follows the parent contract.</text>
<text x="56" y="431" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">A subtype must remain substitutable.</text>
<rect x="616" y="312" width="548" height="168" rx="16" fill="#e6f5f2" stroke="#087e80" stroke-width="1.4"/>
<text x="636" y="346" font-size="22" font-weight="650" text-anchor="start" fill="#087e80">Polymorphism</text>
<text x="636" y="377" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">CardGateway and FakeGateway implement</text>
<text x="636" y="404" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">the same PaymentGateway contract.</text>
<text x="636" y="431" font-size="19" font-weight="400" text-anchor="start" fill="#18243a">Checkout can use either implementation.</text>
<text x="36" y="517" font-size="18" font-weight="400" text-anchor="start" fill="#52617a">No deep inheritance tree is required to apply these principles.</text>
</g></svg>
